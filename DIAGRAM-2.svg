<svg width="680" height="740" viewBox="0 0 680 740" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Bedtime Story Generator — System Diagram</title>
  <desc>Flowchart showing the flow from user input through storyteller, LLM judge, quality gate, refinement loop, and user feedback loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .th { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; font-weight: 400; }
      .arr { stroke: #666; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- USER INPUT -->
  <rect x="215" y="30" width="250" height="52" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">User input</text>
  <text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">Story request (free text)</text>

  <line x1="340" y1="82" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>

  <!-- STORYTELLER AGENT -->
  <rect x="175" y="118" width="330" height="68" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="340" y="143" text-anchor="middle" dominant-baseline="central" fill="#CECBF6">Storyteller agent</text>
  <text class="ts" x="340" y="163" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC">3-act arc · ages 5–10 · calming tone · 300–400 words</text>

  <line x1="340" y1="186" x2="340" y2="222" class="arr" marker-end="url(#arrow)"/>

  <!-- LLM JUDGE -->
  <rect x="155" y="222" width="370" height="80" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="340" y="249" text-anchor="middle" dominant-baseline="central" fill="#FAC775">LLM judge</text>
  <text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">Scores: age-appropriateness · structure · engagement</text>
  <text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central" fill="#EF9F27">calming quality · fulfills request → overall + critique</text>

  <!-- REFINEMENT -->
  <rect x="536" y="222" width="116" height="68" rx="8" fill="#712B13" stroke="#D85A30" stroke-width="0.5"/>
  <text class="th" x="594" y="249" text-anchor="middle" dominant-baseline="central" fill="#F5C4B3">Refinement</text>
  <text class="ts" x="594" y="268" text-anchor="middle" dominant-baseline="central" fill="#F0997B">Revise using</text>
  <text class="ts" x="594" y="284" text-anchor="middle" dominant-baseline="central" fill="#F0997B">judge critique</text>

  <line x1="340" y1="302" x2="340" y2="338" class="arr" marker-end="url(#arrow)"/>

  <!-- QUALITY GATE -->
  <rect x="215" y="338" width="250" height="52" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="340" y="360" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7">Quality gate</text>
  <text class="ts" x="340" y="376" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9">Overall score ≥ 7.0 / 10?</text>

  <!-- NO loop -->
  <path d="M465 364 L560 364 L560 260 L527 260" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="ts" x="484" y="352" dominant-baseline="central" fill="#888">No (up to 2×)</text>

  <!-- YES -->
  <line x1="340" y1="390" x2="340" y2="426" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="354" y="412" dominant-baseline="central" fill="#888">Yes</text>

  <!-- STORY PRESENTED -->
  <rect x="175" y="426" width="330" height="52" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="340" y="449" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">Story presented</text>
  <text class="ts" x="340" y="465" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">Final story + judge scores displayed</text>

  <line x1="340" y1="478" x2="340" y2="514" class="arr" marker-end="url(#arrow)"/>

  <!-- USER FEEDBACK LOOP -->
  <rect x="155" y="514" width="370" height="80" rx="8" fill="#0C447C" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="340" y="541" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">User feedback loop</text>
  <text class="ts" x="340" y="561" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">Accept · Quit · Type revision notes</text>
  <text class="ts" x="340" y="579" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">(e.g. "add a dragon", "make it funnier")</text>

  <!-- Revise loop left -->
  <path d="M155 554 L80 554 L80 152 L173 152" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="ts" x="56" y="354" text-anchor="middle" dominant-baseline="central" fill="#888" transform="rotate(-90,56,354)">Revise story</text>

  <line x1="340" y1="594" x2="340" y2="634" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="354" y="618" dominant-baseline="central" fill="#888">Accept / Quit</text>

  <!-- END -->
  <rect x="215" y="634" width="250" height="58" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="340" y="658" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7">End</text>
  <text class="ts" x="340" y="676" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9">Story accepted — goodnight!</text>

</svg>
